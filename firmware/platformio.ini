; Chip target only. The Feather pin map is not the product.
; GPIO numbers for the custom board are in src/board_pins.h and are
; written through the nRF GPIO registers, not Arduino pin numbers.
; SoftDevice S132, which is what this board package builds.

[env:charge_counter]
platform = nordicnrf52
board = adafruit_feather_nrf52832
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
  -DNEOPIXEL_PIN=2
